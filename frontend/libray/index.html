<!DOCTYPE html>
<html lang="ja">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ESION</title>
</head>

<body>

  <header class="site-header">
    <div class="container header-inner">

      <div class="logo">
        <img src="./images/logo.svg" alt="ESION ロゴ">
      </div>

      <nav class="main-nav">
        <a href="#" class="active">ストア</a>
        <a href="#">ライブラリ</a>
        <a href="#" class="has-arrow">カテゴリー</a> </nav>
      </nav>

      <div class="header-actions">
        <div class="search-box">
          <img src="./images/検索マーク.svg" alt="検索アイコン">
          <input type="search" placeholder="検索">
        </div>
      
        <div class="user-action-group">
          <div class="auth-links">
            <a href="#">ログイン</a>
            <span class="divider">|</span>
            <a href="#">ログアウト</a>
          </div>
      
          <div class="icon-links">
            <a class="iine" href="#">
              <img src="./images/いいねマーク.svg" alt="お気に入り">
            </a>
            <a class="cart" href="#">
              <img src="./images/カートマーク.svg" alt="ショッピングカート">
            </a>
            <a class="user" href="#">
              <img src="./images/アイコンマーク.svg" alt="ユーザーメニュー">
            </a>
          </div>
        </div>
      </div>

    </div>
  </header>

  </body>
</html>
