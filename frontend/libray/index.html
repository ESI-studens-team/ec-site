<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>ESION</title>
</head>

<body>

  <header class="site-header">

    <div class="header-inner">

      <!-- ロゴ -->
      <div class="logo">
        <img src="./images/logo.svg" alt="ESIONロゴ">
      </div>

      <!-- 中央 -->
      <div class="center-area">

        <nav class="main-nav">
          <a href="#">ストア</a>
          <a href="#" class="active">ライブラリ</a>
          <a href="#">カテゴリー ▼</a>
        </nav>

        <div class="search-box">
          <img src="./images/検索マーク.svg" alt="">
          <input type="search">
        </div>

      </div>

      <!-- 右 -->
      <div class="header-right">

        <div class="auth-links">
          <a href="#">ログイン</a>
          <span>|</span>
          <a href="#">ログアウト</a>
        </div>

        <div class="icon-links">

          <a href="#">
            <img src="./images/いいねマーク.svg" alt="">
          </a>

          <a href="#">
            <img src="./images/カートマーク.svg" alt="">
          </a>

          <a href="#">
            <img src="./images/アイコンマーク.svg" alt="">
          </a>

        </div>

      </div>

    </div>

  </header>

  <main class="library-main">

    <aside class="library-sidebar">

      <div class="sidabar-header">
        <p>すべて</p>
        <span>▼</span>
      </div>

      <ul class="game-list">

        <li class="game-item">
          <img src="./images/デドバ-本.jpg" alt="">
          <span>デドバ</span>
        </li>

        <li class="game-item">
          <img src="./images/モンハン-本.jpg" alt="">
          <span>モンハン</span>
        </li>

        <li class="game-item">
          <img src="./images/サイバー-本.jpg" alt="">
          <span>サイバー</span>
        </li>

      </ul>

    </aside>

    <section class="library-content">

      <section class="recent-games">

        <h2>最近遊んだゲーム</h2>

        <div class="recent-games-list">

          <div class="recent-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="recent-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="recent-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="recent-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="recent-card">
            <img src="./images/デドバ-本.jpg">
          </div>

        </div>

      </section>

      <section class="collection">

        <h2>あなたのコレクション</h2>

        <div class="collection-list">

          <div class="collection-card add-card">
            <span>＋</span>
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

          <div class="collection-card">
            <img src="./images/デドバ-本.jpg">
          </div>

        </div>

      </section>

    </section>
  </main>

</body>

</html>
