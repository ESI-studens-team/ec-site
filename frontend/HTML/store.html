<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EC-site</title>
    <link rel="stylesheet" href="../CSS/store.css">


</head>

<body>

    <!-- メイン -->

    <main class="store-main">
        <section class="hero">
            <div class="hero-inner">
                <img src="../images/Karigazou.png" alt="メインビジュアル">
            </div>

            <div class="hero-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </section>

        <section class="ranking-section">
            <div class="section-inner">
                <h2 class="section-title">人気ランキング</h2>

                <div class="ranking-first">
                    <h3 class="ranking-title">1位 👑</h3>
                    <div class="ranking-card ranking-card-large">
                        <img src="../images/Karigazou.png" alt="人気ランキング1位のゲーム画像">
                    </div>
                </div>

                <div class="ranking-list">
                    <div class="ranking-item">
                        <h3 class="ranking-title">2位</h3>
                        <div class="ranking-card ranking-card-small">
                            <img src="../images/Karigazou.png" alt="人気ランキング2位のゲーム画像">
                        </div>
                    </div>

                    <div class="ranking-item">
                        <h3 class="ranking-title">3位</h3>
                        <div class="ranking-card ranking-card-small">
                            <img src="../images/Karigazou.png" alt="人気ランキング3位のゲーム画像">
                        </div>
                    </div>
                </div>
            </div>
        </section>



        <section class="recommend-section">
            <div class="section-inner">
                <h2 class="section-title">あなたへのおすすめ</h2>

                <div class="recommend-layout">
                    <!-- 左：半円 -->
                    <div class="recommend-left">
                        <div class="recommend-circle-wrap">
                            <div class="recommend-circle-outer">
                            </div>
                        </div>
                    </div>

                    <!-- 中央：棒 + カード + 棒 -->
                    <div class="recommend-center">
                        <div class="recommend-bar-wrap recommend-bar-wrap-top">
                            <div class="recommend-bar recommend-bar-top"></div>
                        </div>

                        <div class="recommend-card-wrap">
                            <div class="recommend-card">
                                <div class="recommend-image">
                                    <img src="../images/Karigazou.png" alt="おすすめゲーム画像">
                                </div>

                                <div class="recommend-info">
                                    <h3 class="recommend-game-title">ゲーム名</h3>

                                    <p class="recommend-text">
                                        テキストテキストテキストテキストテキストテキストテキスト
                                        テキストテキストテキストテキストテキストテキストテキスト
                                        テキストテキスト。
                                    </p>

                                    <div class="game-review">
                                        <span>レビュー</span>
                                        <img src="../images/star1.svg" alt="評価">
                                        <img src="../images/star1.svg" alt="評価">
                                        <img src="../images/star1.svg" alt="評価">
                                        <img src="../images/star2.svg" alt="評価">
                                        <img src="../images/star2.svg" alt="評価">
                                    </div>

                                    <a href="#" class="recommend-button">カートに追加</a>
                                </div>
                            </div>
                        </div>

                        <div class="recommend-bar-wrap recommend-bar-wrap-bottom">
                            <div class="recommend-bar recommend-bar-bottom"></div>
                        </div>
                    </div>

                    <!-- 右：三つ矢印 -->
                    <div class="recommend-right">
                        <button class="recommend-arrow" type="button" aria-label="前のおすすめを見る">
                            <span>⌃</span>
                            <span>⌃</span>
                            <span>⌃</span>
                        </button>

                        <button class="recommend-arrow" type="button" aria-label="次のおすすめを見る">
                            <span>⌃</span>
                            <span>⌃</span>
                            <span>⌃</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>


        <!-- カテゴリー別 -->
        <section class="category-section">
            <div class="section-inner">
                <h2 class="section-title">カテゴリー別</h2>

                <div class="category-wrapper">
                    <button class="category-arrow category-arrow-left">‹</button>

                    <div class="category-grid">
                        <div class="category-item">
                            <p class="category-name">カテゴリー名</p>
                            <div class="category-card">
                                <img src="../images/Karigazou.png" alt="カテゴリー画像">
                            </div>
                        </div>

                        <div class="category-item">
                            <p class="category-name">カテゴリー名</p>
                            <div class="category-card">
                                <img src="../images/Karigazou.png" alt="カテゴリー画像">
                            </div>
                        </div>

                        <div class="category-item">
                            <p class="category-name">カテゴリー名</p>
                            <div class="category-card">
                                <img src="../images/Karigazou.png" alt="カテゴリー画像">
                            </div>
                        </div>

                        <div class="category-item">
                            <p class="category-name">カテゴリー名</p>
                            <div class="category-card">
                                <img src="../images/Karigazou.png" alt="カテゴリー画像">
                            </div>
                        </div>
                    </div>

                    <button class="category-arrow category-arrow-right">›</button>
                </div>
            </div>
        </section>
    </main>




</body>

</html>
