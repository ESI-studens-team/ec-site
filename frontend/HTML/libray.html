<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/libray.css">
  <title>ESION</title>
</head>

<body>

  <main class="library-main">

    <!-- サイドバー -->
    <aside class="library-sidebar">

      <!-- ゲーム一覧 -->
      <div class="sidebar-header">
        <p>すべて</p>
        <span class="arrow">▼</span>
      </div>

      <ul class="game-list">
        <li class="game-item">
          <img src="../images/デドバ-本.jpg" alt="デッドバイデイライト">
          <span>デドバ</span>
        </li>

        <li class="game-item">
          <img src="../images/モンハン-本.jpg" alt="モンスターハンター">
          <span>モンハン</span>
        </li>

        <li class="game-item">
          <img src="../images/サイバー-本.jpg" alt="サイバーパンク">
          <span>サイバー</span>
        </li>
      </ul>

    </aside>

    <!-- メインコンテンツ -->
    <section class="library-content">

      <!-- 最近遊んだゲーム -->
      <section class="recent-games">

        <h2>最近遊んだゲーム</h2>

        <div class="recent-games-list">

          <div class="recent-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="recent-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="recent-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="recent-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="recent-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

        </div>

      </section>

      <!-- あなたのコレクション -->
      <section class="collection">

        <h2>あなたのコレクション</h2>

        <div class="collection-list">

          <div class="collection-card add-card">
            <span>＋</span>
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

          <div class="collection-card">
            <img src="../images/デドバ-本.jpg" alt="">
          </div>

        </div>

      </section>

    </section>

  </main>

  <script src="../JavaScript/library.js"></script>

</body>

</html>
